name: Telegram blog
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: telegram-blog
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch posts from Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHANNEL: ${{ vars.TG_CHANNEL }}
        run: python3 .github/scripts/fetch_telegram.py
      - name: Commit changes
        run: |
          git config user.name "telegram-blog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add blog
          git diff --cached --quiet || (git commit -m "Обновление блога из Telegram" && git push)
